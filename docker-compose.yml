version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: focusflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: focusflow123
      MYSQL_DATABASE: focusflow
      MYSQL_USER: focusflow
      MYSQL_PASSWORD: focusflow123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./focusflow_schema.sql:/docker-entrypoint-initdb.d/schema.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:
